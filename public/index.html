<title>Réservation Atelier Mèche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — top bar, then a two-column workspace (steps + sticky summary) that stacks on phones. */
:root {
  --bg: #F2F5F4; --surface: #FFFFFF; --sunken: #E8EEEC; --ink: #142120; --muted: #586B68; --line: #D5DFDC;
  --accent: #1B6D70; --accent-ink: #FFFFFF; --accent-soft: #D9ECEA;
  --ok: #2C7A3B; --ok-soft: #DDF0E0; --warn: #A3600F; --warn-soft: #F8EAD6; --danger: #B3261E; --danger-soft: #F7DEDC;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1413; --surface: #16201F; --sunken: #1C2827; --ink: #E4EEEC; --muted: #93A6A2; --line: #2A3836;
  --accent: #4DB2AE; --accent-ink: #05201F; --accent-soft: #17393A;
  --ok: #6CC67C; --ok-soft: #173321; --warn: #E3A04B; --warn-soft: #3A2A12; --danger: #F08A80; --danger-soft: #3D1A18;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1413; --surface: #16201F; --sunken: #1C2827; --ink: #E4EEEC; --muted: #93A6A2; --line: #2A3836;
  --accent: #4DB2AE; --accent-ink: #05201F; --accent-soft: #17393A;
  --ok: #6CC67C; --ok-soft: #173321; --warn: #E3A04B; --warn-soft: #3A2A12; --danger: #F08A80; --danger-soft: #3D1A18;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance }
h1 { font-size: 1.6rem } h2 { font-size: 1.3rem } h3 { font-size: 1.05rem }
p { margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono { font-family: var(--font-mono); font-size: .85em }
.muted { color: var(--muted) }
.num { font-variant-numeric: tabular-nums }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0 }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none }
.brand-mark svg { width: 20px; height: 20px }
.brand b { font-family: var(--font-display); font-size: 1.1rem; display: block; line-height: 1.1 }
.brand small { color: var(--muted); font-size: .78rem }
.nav { display: flex; gap: 4px; flex-wrap: wrap }
.nav a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 999px; font-weight: 500; font-size: .9rem }
.nav a:hover { color: var(--ink); background: var(--sunken) }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg) }
.mode-pill { font-family: var(--font-mono); font-size: .72rem; padding: 3px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap }

main { padding-block: 24px 64px }

/* Buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: .9rem; text-decoration: none; color: var(--ink) }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.danger { color: var(--danger); border-color: var(--danger) }
.btn.ghost { border-color: transparent; background: transparent }
.btn.sm { padding: 4px 10px; font-size: .82rem }
.btn:disabled { opacity: .45; cursor: not-allowed }
.field { display: grid; gap: 4px; min-width: 0 }
.field > span { font-size: .82rem; font-weight: 500; color: var(--muted) }
input[type=text], input[type=tel], input[type=email], input[type=number], input[type=time], input[type=date], input[type=search], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0 }
textarea { resize: vertical; min-height: 80px }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer }
.check input { margin-top: 3px; accent-color: var(--accent) }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: .9rem }
.notice.err { background: var(--danger-soft); color: var(--danger) }
.notice.ok { background: var(--ok-soft); color: var(--ok) }
.notice.info { background: var(--accent-soft); color: var(--ink) }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.st-confirmed { background: var(--ok-soft); color: var(--ok) }
.st-pending { background: var(--warn-soft); color: var(--warn) }
.st-cancelled { background: var(--danger-soft); color: var(--danger) }
.st-done { background: var(--accent-soft); color: var(--accent) }
.st-noshow { background: var(--sunken); color: var(--muted) }

/* ---------- Guest booking ---------- */
.booking { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; padding: 0; list-style: none }
.steps li { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--sunken) }
.steps li i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-size: .72rem; font-weight: 600 }
.steps li.on { background: var(--ink); color: var(--bg) }
.steps li.on i { background: var(--accent); color: var(--accent-ink) }
.steps li.done i { background: var(--accent); color: var(--accent-ink) }
.steps li.done { cursor: pointer }
.panel { padding: 20px; display: grid; gap: 18px }
.panel-head { display: grid; gap: 4px }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; font-size: .88rem }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.svc-list { display: grid; gap: 8px }
.svc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; width: 100% }
.svc:hover { border-color: var(--accent) }
.svc[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft) }
.svc .name { font-weight: 600 }
.svc .desc { color: var(--muted); font-size: .86rem; grid-column: 1 }
.svc .price { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums }
.svc .dur { color: var(--muted); font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums }
.seg { display: flex; flex-wrap: wrap; gap: 8px }
.seg button { flex: 1 1 140px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent) }
.seg small { display: block; color: var(--muted); font-size: .8rem }
.opt-list { display: grid; gap: 8px }
.opt { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface) }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.opt input { accent-color: var(--accent); width: 18px; height: 18px }
.opt small { display: block; color: var(--muted) }
.staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px }
.staff-card { padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; display: grid; gap: 8px; justify-items: start }
.staff-card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent) }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); color: #fff; flex: none }
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin }
.day { flex: none; width: 70px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: center; display: grid; gap: 1px }
.day b { font-size: 1.25rem; font-family: var(--font-display); font-variant-numeric: tabular-nums }
.day span, .day small { font-size: .72rem; color: var(--muted) }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.day[aria-pressed="true"] span, .day[aria-pressed="true"] small { color: var(--bg); opacity: .8 }
.day:disabled { opacity: .45; cursor: not-allowed; background: var(--sunken) }
.slot-group { display: grid; gap: 8px }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px }
.slot { padding: 8px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-variant-numeric: tabular-nums; font-weight: 500 }
.slot:hover { border-color: var(--accent) }
.slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.form-grid .full { grid-column: 1 / -1 }
.actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap }

.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); padding: 18px; display: grid; gap: 14px }
.sum-lines { display: grid; gap: 6px; font-size: .9rem }
.sum-line { display: flex; justify-content: space-between; gap: 12px }
.sum-line span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap }
.sum-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 12px }
.sum-total b { font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums }
.salon-info { font-size: .84rem; color: var(--muted); display: grid; gap: 2px }

.ticket { padding: 28px; display: grid; gap: 18px; justify-items: start }
.ticket-code { font-family: var(--font-mono); font-size: 1.6rem; letter-spacing: .12em; padding: 6px 14px; border: 2px dashed var(--accent); border-radius: 8px; color: var(--accent) }
.kv { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 6px 18px; font-size: .92rem }
.kv dt { color: var(--muted) } .kv dd { margin: 0 }

/* ---------- Pro / dev ---------- */
.pro-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 18px }
.kpi { padding: 14px 16px; display: grid; gap: 2px }
.kpi b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums }
.subnav { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto }
.subnav button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap }
.subnav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px }
.toolbar .grow { flex: 1 1 200px }

.planning-wrap { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 18px; align-items: start }
.planning { overflow-x: auto }
.pl-grid { display: grid; min-width: 520px; position: relative }
.pl-head { position: sticky; top: 0; background: var(--surface); z-index: 2; padding: 10px 8px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: .9rem }
.pl-head .avatar { width: 26px; height: 26px; font-size: .75rem }
.pl-times { position: relative; border-right: 1px solid var(--line) }
.pl-times span { position: absolute; right: 6px; font-size: .7rem; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums }
.pl-times span:first-child { transform: none }
.pl-col { position: relative; border-right: 1px solid var(--line) }
.pl-col:last-child { border-right: 0 }
.pl-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); opacity: .6 }
.pl-line.half { border-top-style: dotted; opacity: .4 }
.pl-off { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--sunken) 0 6px, transparent 6px 12px) }
.pl-off span { position: absolute; top: 4px; left: 6px; font-size: .7rem; color: var(--muted) }
.pl-bk { position: absolute; left: 4px; right: 4px; border-radius: 6px; padding: 4px 7px; font-size: .76rem; line-height: 1.25; overflow: hidden; cursor: pointer; border: 0; text-align: left; border-left: 4px solid; background: var(--accent-soft); color: var(--ink) }
.pl-bk b { display: block; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pl-bk.pending { background: var(--warn-soft) }
.pl-bk.done { opacity: .7 }
.pl-bk.noshow { background: var(--sunken); text-decoration: line-through }
.pl-bk[aria-pressed="true"] { outline: 2px solid var(--ink) }
.pl-now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--danger); z-index: 1 }
.detail { padding: 18px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px) }
.detail .btns { display: flex; flex-wrap: wrap; gap: 6px }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .88rem }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--sunken); white-space: nowrap }
tr:last-child td { border-bottom: 0 }
td.r, th.r { text-align: right }
td input[type=text], td input[type=number], td select { padding: 5px 8px }
td input[type=number] { width: 80px }
tr.inactive td { opacity: .55 }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; align-items: start }
.section { padding: 18px; display: grid; gap: 14px }
.hours-row { display: grid; grid-template-columns: 110px 70px repeat(4, minmax(0,1fr)); gap: 8px; align-items: center; font-size: .88rem }
.hours-row.head { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.staff-edit { padding: 16px; display: grid; gap: 12px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: .82rem; cursor: pointer; background: var(--surface) }
.chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent) }
.chip input { accent-color: var(--accent) }
pre.json { margin: 0; padding: 14px; background: var(--sunken); border-radius: 8px; font-family: var(--font-mono); font-size: .78rem; overflow: auto; max-height: 340px; white-space: pre }
.log { font-family: var(--font-mono); font-size: .78rem; display: grid; gap: 4px; max-height: 260px; overflow: auto }
.log div { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 8px }
.endpoint { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 4px 10px; font-family: var(--font-mono); font-size: .8rem }
.endpoint b { color: var(--accent) }
.empty { padding: 28px; text-align: center; color: var(--muted) }

@media (max-width: 900px) {
  .booking, .planning-wrap { grid-template-columns: 1fr }
  .summary, .detail { position: static }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)) }
  .grid2 { grid-template-columns: 1fr }
}
@media (max-width: 560px) {
  .form-grid { grid-template-columns: 1fr }
  .hours-row { grid-template-columns: 80px 50px repeat(2, minmax(0,1fr)) }
  .hours-row .brk { display: none }
  h1 { font-size: 1.35rem }
  .panel { padding: 16px }
}
@media (prefers-reduced-motion: no-preference) {
  .svc, .slot, .day, .staff-card, .opt, .btn { transition: border-color .15s, background-color .15s, box-shadow .15s }
}
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6 20 18M8.6 16.4 20 6"/></svg>
      </div>
      <div><b id="brand-name">Atelier Mèche</b><small id="brand-tag">Prise de rendez-vous en ligne</small></div>
    </div>
    <nav class="nav" aria-label="Interfaces">
      <a href="#reserver" data-route="reserver">Réserver</a>
      <a href="#mes-rdv" data-route="mes-rdv">Mes rendez-vous</a>
      <a href="#pro" data-route="pro">Espace pro · dev</a>
    </nav>
    <span class="mode-pill" id="mode-pill" title="Où sont stockées les données">connexion…</span>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
/* ============================================================
   Utilitaires
   ============================================================ */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const toHM = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const clone = o => JSON.parse(JSON.stringify(o));
const euro = n => Number(n || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: Number(n) % 1 ? 2 : 0 });
const dur = m => m >= 60 ? Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + pad(m % 60) : '') : m + ' min';
const fmtDate = s => parseYmd(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parseYmd(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
const DAY_NAMES = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const rid = () => Math.random().toString(36).slice(2, 10);
const bookingCode = () => 'AM-' + Array.from({ length: 5 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const normPhone = p => String(p || '').replace(/[^\d+]/g, '');
const STATUS = { confirmed: 'Confirmé', pending: 'En attente', cancelled: 'Annulé', done: 'Honoré', noshow: 'Absent' };
const badge = s => `<span class="badge st-${esc(s)}">${esc(STATUS[s] || s)}</span>`;

/* ============================================================
   Configuration par défaut du salon (options coiffeur)
   ============================================================ */
const CATEGORIES = [

const LS_KEY = 'atelier-meche-rdv-v1';
const Store = {
  mode: 'init', config: clone(DEFAULT_CONFIG), bookings: [], loading: true, canEditConfig: true, canBook: true, error: '',
  log: [],
  note(msg) { this.log.unshift({ t: new Date().toLocaleTimeString('fr-FR'), msg }); this.log.length = Math.min(this.log.length, 50); },
  async init() {
    if (window.claude && typeof window.claude.use === 'function') {
      try { const db = await window.claude.use('db'); if (db) return this.initDb(db); } catch (e) {}
    } else if (location.protocol.startsWith('http')) {
      try { const r = await fetch('api/state', { cache: 'no-store', headers: { 'x-admin-pin': P.pin || '' } }); if (r.ok) return this.initApi(await r.json()); } catch (e) {}

  /* --- navigateur (localStorage) --- */
  initLocal() {

    window.addEventListener('storage', e => { if (e.key === LS_KEY) { try { const s = JSON.parse(e.newValue); this.config = normalizeConfig(s.config); this.bookings = s.bookings || []; render(); } catch (x) {} } });
    this.loading = false; this.note('Stockage local (navigateur) prêt'); render();
  },
  persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ config: this.config, bookings: this.bookings })); } catch (e) {} },
  /* --- API REST (server.js) --- */
  initApi(state) {
    this.mode = 'api'; this.applyApi(state); this.loading = false; this.note('Connecté à l’API REST /api'); render();
    setInterval(async () => {
      try { const r = await fetch('api/state', { cache: 'no-store', headers: { 'x-admin-pin': P.pin || '' } }); if (r.ok) { const s = await r.json(); if (JSON.stringify(s) !== this._last) { this.applyApi(s); render(); } } } catch (e) {}
    }, 5000);
  },
  async refreshApi() { try { const r = await fetch('api/state', { cache: 'no-store', headers: { 'x-admin-pin': P.pin || '' } }); if (r.ok) { this.applyApi(await r.json()); render(); } } catch (e) {} },
  applyApi(s) { this._last = JSON.stringify(s); this.config = normalizeConfig(s.config); this.bookings = s.bookings || []; },
  async api(method, url, body) {
    const r = await fetch(url, { method, headers: { 'content-type': 'application/json', 'x-admin-pin': P.pin || '' }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.message || 'Erreur serveur'); e.code = j.error || r.status; throw e; }
    return j;
  },
  /* --- base partagée claude.ai (capability db) --- */
  async initDb(db) {
    this.mode = 'db'; this.db = db;
    try {
      const user = await window.claude.use('user');
      if (user) {
        this.canEditConfig = (await user.canEdit()) ?? true;
        const w = await user.can('data.write'); this.canBook = w === null ? true : !!w;
      }
    } catch (e) {}
    const timer = setTimeout(() => { if (this.loading) { this.error = 'Les données partagées ne répondent pas encore. Les créneaux affichés peuvent être incomplets.'; render(); } }, 10000);
    let gotCfg = false, gotBk = false;
    const done = () => { if (gotCfg && gotBk && this.loading) { this.loading = false; this.error = ''; clearTimeout(timer); this.note('Base partagée claude.ai synchronisée'); } };
    db.doc('salon/config').onSnapshot(s => {
      this.config = normalizeConfig(s.exists ? (s.data() || {}).config : null);
      if (!s.metadata.fromCache) { gotCfg = true; done(); } render();
    }, e => { this.error = 'Configuration indisponible (' + e.code + ').'; render(); });
    db.collection('bookings').onSnapshot(q => {
      this.bookings = q.docs.map(d => d.data());
      if (!q.metadata.fromCache) { gotBk = true; done(); } render();
    }, e => { this.error = 'Réservations indisponibles (' + e.code + ').'; this.loading = false; render(); });
  },
  _cfgChain: Promise.resolve(),
  /* --- opérations communes --- */
  async saveConfig(cfg, what) {
    this.config = normalizeConfig(cfg);
    this.note('Config modifiée : ' + (what || 'paramètres'));
    if (this.mode === 'local') { this.persistLocal(); render(); return; }
    if (this.mode === 'api') { await this.api('PUT', 'api/config', { config: this.config }); return; }
    if (this.mode === 'db') {
      const snapshot = clone(this.config);
      this._cfgChain = this._cfgChain.then(() => this.db.doc('salon/config').set({ config: snapshot, updatedAt: new Date().toISOString() }))
        .catch(e => { this.error = e.code === 'invalid_argument' ? 'Seuls les éditeurs de cette page peuvent modifier la configuration.' : 'Enregistrement impossible (' + e.code + ').'; this.canEditConfig = false; render(); });
      render(); return this._cfgChain;
    }
  },
  async addBooking(b) {
    // revérifie le créneau juste avant d'écrire
    if (!slotStillFree(this.config, this.bookings, b)) { const e = new Error('Ce créneau vient d’être pris.'); e.code = 'slot_taken'; throw e; }
    if (this.mode === 'api') { const r = await this.api('POST', 'api/bookings', b); this.bookings.push(r.booking || b); }
    else if (this.mode === 'db') {
      try { await this.db.collection('bookings').doc(b.id).set(b); }
      catch (e) { const er = new Error(e.code === 'invalid_argument' ? 'Votre accès à cette page ne permet pas de réserver.' : 'Réservation impossible (' + e.code + ').'); er.code = e.code; throw er; }
    } else { this.bookings.push(b); this.persistLocal(); }

  },
  async updateBooking(id, patch, verifyPhone) {

    patch = { ...patch, updatedAt: new Date().toISOString() };
    if (this.mode === 'api') await this.api('PATCH', 'api/bookings/' + encodeURIComponent(id), verifyPhone ? { ...patch, verifyPhone } : patch);
    else if (this.mode === 'db') await this.db.doc('bookings/' + id).update(patch);
    Object.assign(b, patch);
    if (this.mode === 'local') this.persistLocal();
    this.note(`RDV ${id} → ${patch.status ? STATUS[patch.status] : 'modifié'}`);
    render();
  },
  async removeBookings(filterFn, label) {
    const ids = this.bookings.filter(filterFn).map(b => b.id);
    if (this.mode === 'api') await this.api('POST', 'api/bookings/delete', { ids });
    else if (this.mode === 'db') { for (const id of ids) await this.db.doc('bookings/' + id).delete(); }
    this.bookings = this.bookings.filter(b => !ids.includes(b.id));
    if (this.mode === 'local') this.persistLocal();
    this.note(`${ids.length} RDV supprimé(s) (${label})`); render();
  },
  async importAll(data) {
    const cfg = normalizeConfig(data.config); const bks = Array.isArray(data.bookings) ? data.bookings : [];
    if (this.mode === 'api') { await this.api('PUT', 'api/state', { config: cfg, bookings: bks }); this.config = cfg; this.bookings = bks; }
    else if (this.mode === 'db') {
      await this.saveConfig(cfg, 'import');
      for (const b of bks) if (b && b.id) await this.db.collection('bookings').doc(String(b.id)).set(b);
    } else { this.config = cfg; this.bookings = bks; this.persistLocal(); }
    this.note(`Import : config + ${bks.length} RDV`); render();
  }
};

const C = () => Store.config;
const svcById = id => C().services.find(s => s.id === id);
const optById = id => C().options.find(o => o.id === id);
const staffById = id => C().staff.find(s => s.id === id);
function quote(sel) {
  const s = svcById(sel.serviceId); if (!s) return null;
  const lines = [{ label: s.name, price: +s.price, dur: +s.duration }];
  if (s.length && sel.length) { const L = C().rules.lengths[sel.length]; if (L && (+L.price || +L.dur)) lines.push({ label: 'Supplément ' + L.label.toLowerCase(), price: +L.price, dur: +L.dur }); }
  for (const id of sel.optionIds || []) { const o = optById(id); if (o) lines.push({ label: o.name, price: +o.price, dur: +o.duration }); }
  return { lines, price: lines.reduce((a, l) => a + l.price, 0), duration: lines.reduce((a, l) => a + l.dur, 0) };
}
function dayInfo(date) {
  const cl = (C().closures || []).find(c => c.date === date);
  if (cl) return { open: false, reason: cl.label || 'Fermeture exceptionnelle' };
  const h = C().hours[parseYmd(date).getDay()];
  if (!h || !h.open) return { open: false, reason: 'Fermé' };
  return { open: true, ...h };
}
function staffForService(s) { return s ? C().staff.filter(p => p.active !== false && (p.cats || []).includes(s.cat)) : []; }
function busyFor(bookings, staffId, date, exceptId) {
  return bookings.filter(b => b.staffId === staffId && b.date === date && b.status !== 'cancelled' && b.id !== exceptId)
    .map(b => [toMin(b.time), toMin(b.time) + (+b.duration)]);
}
function freeSlots(date, staffIds, duration, bookings = Store.bookings) {
  const d = dayInfo(date); if (!d.open || !duration) return [];
  const R = C().rules, step = Math.max(5, +R.slotStep || 15), buf = +R.bufferMin || 0;
  const start = toMin(d.start), end = toMin(d.end);
  const brk = d.breakStart && d.breakEnd ? [toMin(d.breakStart), toMin(d.breakEnd)] : null;
  const minAt = Date.now() + (+R.minNoticeHours || 0) * 3600e3;
  const dow = parseYmd(date).getDay();
  const pool = staffIds.map(id => staffById(id)).filter(p => p && (p.days || []).includes(dow)).map(p => ({ id: p.id, busy: busyFor(bookings, p.id, date) }));
  const out = [];
  for (let t = start; t + duration <= end; t += step) {
    const at = parseYmd(date); at.setMinutes(t); if (at.getTime() < minAt) continue;
    if (brk && t < brk[1] && t + duration > brk[0]) continue;
    const free = pool.filter(p => p.busy.every(([a, b]) => t + duration + buf <= a || t >= b + buf)).map(p => p.id);
    if (free.length) out.push({ time: toHM(t), staffIds: free });
  }
  return out;
}
function slotStillFree(cfg, bookings, b) {
  const t = toMin(b.time), buf = +cfg.rules.bufferMin || 0;
  return busyFor(bookings, b.staffId, b.date, b.id).every(([a, e]) => t + (+b.duration) + buf <= a || t >= e + buf);
}
function pickStaff(ids, date) { // sans préférence : le moins chargé ce jour-là
  const load = id => Store.bookings.filter(b => b.staffId === id && b.date === date && b.status !== 'cancelled').reduce((a, b) => a + (+b.duration), 0);
  return ids.slice().sort((a, b) => load(a) - load(b))[0];
}
function canCancel(b) {
  if (!['confirmed', 'pending'].includes(b.status)) return false;
  const at = parseYmd(b.date); at.setMinutes(toMin(b.time));
  return at.getTime() - Date.now() >= (+C().rules.cancelHours || 0) * 3600e3;
}

const STEPS = ['Prestation', 'Personnaliser', 'Coiffeur', 'Date & heure', 'Coordonnées'];
function viewBooking() {

  const s = svcById(G.serviceId);
  const steps = `<ol class="steps">${STEPS.map((n, i) => {
    const k = i + 1, cls = k === G.step ? 'on' : k < G.step ? 'done' : '';
    return `<li class="${cls}" ${k < G.step ? `data-act="goto" data-step="${k}" role="button" tabindex="0"` : ''}><i>${k < G.step ? '✓' : k}</i>${n}</li>`;
  }).join('')}</ol>`;

  if (G.step === 1) body = stepService();
  else if (G.step === 2) body = stepCustomize(s);
  else if (G.step === 3) body = stepStaff(s);
  else if (G.step === 4) body = stepDate(s);

function proPlanning() {
  const d = P.date, info = dayInfo(d), team = C().staff.filter(p => p.active !== false);
  const dow = parseYmd(d).getDay();
  const hrs = WEEK_ORDER.map(k => C().hours[k]).filter(h => h && h.open);
  const gStart = Math.floor(Math.min(...hrs.map(h => toMin(h.start)), 540) / 60) * 60;
  const gEnd = Math.ceil(Math.max(...hrs.map(h => toMin(h.end)), 1140) / 60) * 60;
  const ppm = 1.1, H = (gEnd - gStart) * ppm;
  const dayB = Store.bookings.filter(b => b.date === d && b.status !== 'cancelled');
  const lines = []; for (let m = gStart; m <= gEnd; m += 30) lines.push(`<div class="pl-line ${m % 60 ? 'half' : ''}" style="top:${(m - gStart) * ppm}px"></div>`);
  const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
  const nowLine = d === today() && nowM > gStart && nowM < gEnd ? `<div class="pl-now" style="top:${(nowM - gStart) * ppm}px"></div>` : '';
  const off = (a, b, label) => b > a ? `<div class="pl-off" style="top:${(a - gStart) * ppm}px;height:${(b - a) * ppm}px">${label ? `<span>${esc(label)}</span>` : ''}</div>` : '';
  const cols = team.map(p => {
    let o = '';
    if (!info.open) o = off(gStart, gEnd, info.reason);
    else if (!(p.days || []).includes(dow)) o = off(gStart, gEnd, 'Repos');
    else { o = off(gStart, toMin(info.start)) + off(toMin(info.end), gEnd) + (info.breakStart && info.breakEnd ? off(toMin(info.breakStart), toMin(info.breakEnd), 'Pause') : ''); }
    const bks = dayB.filter(b => b.staffId === p.id).map(b => {
      const top = (toMin(b.time) - gStart) * ppm, h = Math.max(22, b.duration * ppm - 2);
      return `<button class="pl-bk ${esc(b.status)}" style="top:${top}px;height:${h}px;border-left-color:${esc(p.color)}" data-act="psel" data-id="${esc(b.id)}" aria-pressed="${P.sel === b.id}">
        <b>${b.time} · ${esc(b.client.name)}</b>${esc(b.serviceName)}${b.status === 'pending' ? ' · à valider' : ''}</button>`;
    }).join('');
    return `<div class="pl-col" style="height:${H}px">${lines.join('')}${o}${bks}${nowLine}</div>`;
  });
  const times = []; for (let m = gStart; m <= gEnd; m += 60) times.push(`<span style="top:${(m - gStart) * ppm}px">${toHM(m)}</span>`);
  const sel = P.sel && Store.bookings.find(b => b.id === P.sel);
  return `<div class="toolbar">
    <button class="btn" data-act="pday" data-n="-1" aria-label="Jour précédent">←</button>
    <input id="p-date" type="date" value="${d}" data-act="pdate" style="width:auto">
    <button class="btn" data-act="pday" data-n="1" aria-label="Jour suivant">→</button>
    <button class="btn ghost" data-act="ptoday">Aujourd’hui</button>
    <b style="text-transform:capitalize">${fmtDate(d)}</b>
    <span class="muted">${info.open ? `${info.start}–${info.end} · ${dayB.length} RDV` : esc(info.reason)}</span>
  </div>
  <div class="planning-wrap">
    <div class="card planning"><div class="pl-grid" style="grid-template-columns:52px repeat(${team.length || 1}, minmax(150px,1fr))">
      <div class="pl-head"></div>${team.map(p => `<div class="pl-head"><span class="avatar" style="background:${esc(p.color)}">${esc(initials(p.name))}</span>${esc(p.name)}</div>`).join('')}
      <div class="pl-times" style="height:${H}px">${times.join('')}</div>${cols.join('')}
    </div></div>
    ${sel ? bookingDetail(sel) : `<aside class="card detail"><span class="label">Détail</span><p class="muted">Cliquez sur un rendez-vous du planning pour le gérer.</p>
      <p class="muted" style="font-size:.86rem">Astuce test : ouvrez « Réserver » dans un autre onglet, prenez un rendez-vous, il apparaît ici.</p></aside>`}
  </div>`;
}

function proList() {
  const t = today(), q = P.q.trim().toLowerCase();
  let list = Store.bookings.slice();
  if (P.filter === 'upcoming') list = list.filter(b => b.date >= t); else if (P.filter === 'past') list = list.filter(b => b.date < t);
  if (P.status !== 'all') list = list.filter(b => b.status === P.status);
  if (q) list = list.filter(b => [b.id, b.client.name, b.client.phone, b.client.email, b.serviceName].join(' ').toLowerCase().includes(q));
  list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) * (P.filter === 'past' ? -1 : 1));

function flash(msg) { P.flash = msg; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { P.flash = ''; render(); }, 3500); }
function setPath(obj, path, val) {
  const keys = path.split('.'); let o = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    const k = keys[i];
    if (Array.isArray(o) && isNaN(+k)) o = o.find(x => x.id === k); else o = o[k];
    if (!o) return;
  }
  const last = keys[keys.length - 1];
  o[last] = val;
}
function getPath(obj, path) { return path.split('.').reduce((o, k) => o == null ? o : Array.isArray(o) && isNaN(+k) ? o.find(x => x.id === k) : o[k], obj); }
const NUM_FIELDS = /\.(duration|price|dur|slotStep|bufferMin|minNoticeHours|maxDaysAhead|cancelHours|maxOptions|depositPct)$/;

async function submitBooking() {
  const c = G.client, R = C().rules;
  G.error = '';
  if (!c.name.trim()) G.error = 'Indiquez votre nom.';
  else if (normPhone(c.phone).length < 10) G.error = 'Indiquez un numéro de téléphone valide (10 chiffres).';
  else if (R.requireEmail && !/^\S+@\S+\.\S+$/.test(c.email)) G.error = 'Indiquez une adresse e-mail valide.';
  else if (c.email && !/^\S+@\S+\.\S+$/.test(c.email)) G.error = 'L’adresse e-mail semble incorrecte.';
  else if (!c.consent) G.error = 'Cochez la case d’accord pour finaliser la réservation.';
  if (G.error) return render();
  const s = svcById(G.serviceId), q = quote(G);
  const slot = freeSlots(G.date, guestStaffIds(s), q.duration).find(x => x.time === G.time);
  if (!slot) { G.error = 'Ce créneau n’est plus disponible. Choisissez-en un autre.'; G.step = 4; G.time = null; return render(); }
  const staffId = G.staffId === 'any' ? pickStaff(slot.staffIds, G.date) : G.staffId;
  const b = {
    id: bookingCode(), date: G.date, time: G.time, duration: q.duration, price: q.price, staffId, anyStaff: G.staffId === 'any',
    serviceId: s.id, serviceName: s.name, lengthLabel: s.length ? C().rules.lengths[G.length].label : '',
    options: G.optionIds.map(id => optById(id)).filter(Boolean).map(o => ({ id: o.id, name: o.name, price: +o.price })),
    client: { name: c.name.trim(), phone: c.phone.trim(), email: c.email.trim(), note: c.note.trim(), first: !!c.first },
    status: R.autoConfirm ? 'confirmed' : 'pending', source: route() === 'reserver' ? 'en ligne' : 'comptoir', createdAt: new Date().toISOString()
  };
  G.busy = true; render();
  try { await Store.addBooking(b); G.done = b; M.code = b.id; M.phone = b.client.phone; }
  catch (e) { G.error = e.code === 'slot_taken' ? 'Ce créneau vient d’être réservé par quelqu’un d’autre. Choisissez-en un autre.' : e.message; if (e.code === 'slot_taken') { G.step = 4; G.time = null; } }
  G.busy = false; render(); window.scrollTo(0, 0);
}

const DEMO_NAMES = ['Sophie Martin', 'Lucas Bernard', 'Emma Petit', 'Hugo Robert', 'Chloé Richard', 'Nathan Durand', 'Inès Moreau', 'Léo Simon', 'Manon Laurent', 'Jules Michel', 'Sarah Garcia', 'Tom Lefebvre', 'Jade Roux', 'Adam Fournier', 'Louise Girard'];
async function generateDemo() {
  const svcs = C().services.filter(s => s.active !== false), bks = Store.bookings.slice(); let n = 0, tries = 0;
  while (n < 20 && tries < 400) {
    tries++;
    const s = svcs[Math.floor(Math.random() * svcs.length)], team = staffForService(s); if (!team.length) continue;
    const date = addDays(today(), Math.floor(Math.random() * 7)), opts = Math.random() < .35 ? [C().options[Math.floor(Math.random() * C().options.length)].id] : [];
    const len = ['courts', 'milongs', 'longs'][Math.floor(Math.random() * 3)];
    const q = quote({ serviceId: s.id, optionIds: opts, length: len });
    const slots = freeSlots(date, team.map(p => p.id), q.duration, bks); if (!slots.length) continue;
    const sl = slots[Math.floor(Math.random() * slots.length)], name = DEMO_NAMES[Math.floor(Math.random() * DEMO_NAMES.length)];
    const b = { id: bookingCode(), date, time: sl.time, duration: q.duration, price: q.price, staffId: sl.staffIds[Math.floor(Math.random() * sl.staffIds.length)], anyStaff: false,
      serviceId: s.id, serviceName: s.name, lengthLabel: s.length ? C().rules.lengths[len].label : '', options: opts.map(id => optById(id)).map(o => ({ id: o.id, name: o.name, price: +o.price })),
      client: { name, phone: '06 ' + Array.from({ length: 4 }, () => pad(Math.floor(Math.random() * 100))).join(' '), email: '', note: '', first: Math.random() < .2 },
      status: Math.random() < .2 ? 'pending' : 'confirmed', source: 'démo', demo: true, createdAt: new Date().toISOString() };
    bks.push(b);
    try { await Store.addBooking(b); n++; } catch (e) { bks.pop(); if (e.code !== 'slot_taken') { flash('Génération interrompue : ' + e.message); return; } }
  }
  if (Store.mode === 'local') render();
  flash(n + ' rendez-vous de démo ajoutés sur les 7 prochains jours.');
}

  switch (a) {
    case 'cat': G.cat = id; break;
    case 'svc': if (G.serviceId !== id) { G.optionIds = []; G.date = null; G.time = null; const s = svcById(id); if (G.staffId !== 'any' && !staffForService(s).some(p => p.id === G.staffId)) G.staffId = 'any'; } G.serviceId = id; G.step = 2; break;
    case 'len': G.length = id; G.time = null; break;
    case 'opt': { const on = el.checked; G.optionIds = on ? [...new Set([...G.optionIds, id])] : G.optionIds.filter(x => x !== id); G.time = null; break; }
    case 'staff': G.staffId = id; G.time = null; break;
    case 'goto': G.step = +el.dataset.step; G.error = ''; window.scrollTo(0, 0); break;
    case 'date': G.date = id; G.time = null; break;
    case 'time': G.time = id; break;
    case 'restart': resetGuest(); break;
    case 'lookup-mine': M.result = id; M.error = ''; break;
    case 'm-cancel': M.confirmCancel = true; break;
    case 'm-cancel-no': M.confirmCancel = false; break;
    case 'm-cancel-yes': M.confirmCancel = false; try { await Store.updateBooking(M.result, { status: 'cancelled', cancelledBy: 'client' }, M.phone); } catch (x) { M.error = 'Annulation impossible : ' + x.message; } break;
    case 'lock': lockPro(); break;
    case 'ptab': P.tab = id; P.confirm = null; break;
    case 'pday': P.date = addDays(P.date, +el.dataset.n); P.sel = null; break;
    case 'ptoday': P.date = today(); P.sel = null; break;
    case 'psel': P.sel = id || null; break;
    case 'open-in-planning': { const b = Store.bookings.find(x => x.id === id); if (b) { P.date = b.date; P.sel = id; P.tab = 'planning'; window.scrollTo(0, 0); } break; }
    case 'bstatus': try { await Store.updateBooking(id, { status: el.dataset.st }); } catch (x) { flash('Modification impossible : ' + x.message); } return;
    case 'pconfirm': P.confirm = id || null; break;
    case 'demo': el.disabled = true; await generateDemo(); return;
    case 'demo-del': P.confirm = null; await Store.removeBookings(b => b.demo, 'démo'); flash('Rendez-vous de démo supprimés.'); return;
    case 'del-all': P.confirm = null; await Store.removeBookings(() => true, 'tous'); flash('Toutes les réservations ont été supprimées.'); return;
    case 'reset-cfg': P.confirm = null; await Store.saveConfig(clone(DEFAULT_CONFIG), 'réinitialisation'); flash('Configuration par défaut restaurée.'); return;
    case 'copy-json': { const txt = document.getElementById('json-out').textContent; try { await navigator.clipboard.writeText(txt); flash('JSON copié.'); } catch (x) { const r = document.createRange(); r.selectNodeContents(document.getElementById('json-out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } return; }
    case 'import': try { const d = JSON.parse(P.importText); if (!d || typeof d !== 'object') throw new Error(); P.importErr = ''; await Store.importAll(d); P.importText = ''; flash('Import terminé.'); } catch (x) { P.importErr = 'JSON invalide : vérifiez que le texte commence par { et contient "config" ou "bookings".'; render(); } return;
    case 'add-svc': { const cfg = clone(C()); cfg.services.push({ id: 'svc-' + rid(), cat: 'femme', name: 'Nouvelle prestation', desc: '', duration: 30, price: 30, length: false, active: true }); await Store.saveConfig(cfg, 'ajout prestation'); return; }
    case 'add-opt': { const cfg = clone(C()); cfg.options.push({ id: 'opt-' + rid(), name: 'Nouvelle option', desc: '', duration: 10, price: 10, active: true }); await Store.saveConfig(cfg, 'ajout option'); return; }
    case 'add-staff': { const cfg = clone(C()); cfg.staff.push({ id: 'st-' + rid(), name: 'Nouveau', role: 'Coiffeur', color: '#5B7F6E', days: [2, 3, 4, 5, 6], cats: ['femme', 'homme'], active: true }); await Store.saveConfig(cfg, 'ajout coiffeur'); return; }
    case 'del-item': { const cfg = clone(C()), L = el.dataset.list; cfg[L] = cfg[L].filter(x => x.id !== id); await Store.saveConfig(cfg, 'suppression ' + L); return; }
    case 'add-closure': { const cfg = clone(C()); cfg.closures.push({ date: addDays(today(), 7), label: 'Congés' }); await Store.saveConfig(cfg, 'fermeture'); return; }
    case 'del-closure': { const cfg = clone(C()); cfg.closures.splice(+el.dataset.i, 1); await Store.saveConfig(cfg, 'fermeture'); return; }
    default: return;
  }
  render();
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('li[data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) { G.client[t.dataset.bind] = t.type === 'checkbox' ? t.checked : t.value; return; }
  if (t.dataset.mbind) { M[t.dataset.mbind] = t.value; return; }
  if (t.dataset.pinbind) { P.pinInput = t.value; return; }
  if (t.dataset.pbind) { P[t.dataset.pbind] = t.value; if (t.dataset.pbind === 'importText') { const b = document.querySelector('[data-act="import"]'); if (b) b.disabled = !t.value.trim(); return; } render(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.act === 'pdate' && t.value) { P.date = t.value; P.sel = null; render(); return; }
  if (t.dataset.cfg) {
    const cfg = clone(C()), path = t.dataset.cfg;
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (NUM_FIELDS.test(path)) v = Math.max(0, Number(v) || 0);
    setPath(cfg, path, v); await Store.saveConfig(cfg, path.split('.').slice(0, 1)[0]); return;
  }
  if (t.dataset.cfgArr) {
    const cfg = clone(C()), arr = getPath(cfg, t.dataset.cfgArr) || [], raw = t.value, v = isNaN(+raw) ? raw : +raw;
    setPath(cfg, t.dataset.cfgArr, t.checked ? [...new Set([...arr, v])] : arr.filter(x => x !== v));
    await Store.saveConfig(cfg, 'équipe'); return;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'client-form') submitBooking();
  if (e.target.id === 'pin-form') {
    if (Store.mode === 'api') {
      const pin = P.pinInput;
      fetch('api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin }) }).then(r => {
        if (r.ok) { P.pin = pin; P.unlocked = true; P.pinErr = ''; try { sessionStorage.setItem('atelier-meche-pin', pin); } catch (x) {} Store.note('Espace pro déverrouillé'); Store.refreshApi(); }
        else P.pinErr = 'Code incorrect.';
        P.pinInput = ''; render();
      });
      return;
    }
    if (checkPin(P.pinInput)) { P.pin = P.pinInput; P.unlocked = true; P.pinErr = ''; P.pinInput = ''; try { sessionStorage.setItem('atelier-meche-pin', P.pin); } catch (x) {} Store.note('Espace pro déverrouillé'); }
    else { P.pinErr = 'Code incorrect.'; P.pinInput = ''; }
    render(); return;
  }
  if (e.target.id === 'mine-form') {
    const b = Store.bookings.find(x => x.id.toUpperCase() === M.code.trim().toUpperCase());
    M.confirmCancel = false;
    if (b && normPhone(b.client.phone).slice(-9) === normPhone(M.phone).slice(-9)) { M.result = b.id; M.error = ''; }
    else { M.result = null; M.error = 'Aucun rendez-vous ne correspond. Vérifiez le numéro (format AM-XXXXX) et le téléphone utilisé lors de la réservation.'; }
    render();
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
setInterval(() => { if (route() === 'pro' && P.tab === 'planning') render(); }, 60000);

render();
Store.init();
</script>
